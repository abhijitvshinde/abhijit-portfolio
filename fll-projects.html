<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Project Board | Mechanical Masters FLL</title>
  <meta name="description" content="Private project board for the Mechanical Masters FLL team: tasks, team posts and a timeline.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="fll.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script>document.documentElement.classList.add('js');</script>
  <meta name="theme-color" content="#05070f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    .pm-page{ padding-top:150px; }
    .pm-page input[type="date"], .pm-page textarea{
      padding:11px 13px; border-radius:12px; border:1px solid rgba(255,255,255,0.14);
      background:rgba(2,6,23,0.6); color:var(--text); font:inherit; font-size:15px; color-scheme:dark;
    }
    .pm-page textarea{ width:100%; min-height:70px; resize:vertical; }
    .pm-tabs{ display:flex; flex-wrap:wrap; gap:8px; margin:0 0 18px; }
    .pm-tab{ padding:10px 16px; border-radius:999px; border:1px solid var(--line); background:rgba(255,255,255,0.04);
      color:var(--muted); font:inherit; font-weight:700; cursor:pointer; }
    .pm-tab[aria-selected="true"]{ color:#020617; background:var(--fll-green); border-color:var(--fll-green); }
    .pm-form{ display:flex; flex-wrap:wrap; gap:10px; align-items:end; margin:10px 0 4px; }
    .pm-form label{ display:grid; gap:4px; font-size:13px; font-weight:700; color:var(--muted); }
    .pm-form .wide{ flex:1 1 100%; }
    .pm-form input[type="text"]{ min-width:200px; width:auto; }
    .pm-form select{ width:auto; }
    .pm-people{ display:flex; flex-wrap:wrap; gap:6px 14px; font-weight:500; color:var(--text); }
    .pm-people label{ display:inline-flex; gap:6px; align-items:center; font-size:14px; color:var(--text); }
    .pm-filters{ display:flex; flex-wrap:wrap; gap:10px; align-items:end; margin-bottom:6px; }
    .pm-page select, .pm-page input[type="text"], .pm-page input[type="password"]{ border-radius:12px; border:1px solid rgba(255,255,255,0.14);
      background:rgba(2,6,23,0.6); color:var(--text); font:inherit; color-scheme:dark; }
    .pm-filters select, .gantt-tools select, .pm-actions select, .pm-form select{ width:auto; padding:9px 12px; font-size:14px; }
    .pm-page select option{ background:#0b1220; color:var(--text); }
    .pm-filters label{ display:grid; gap:4px; font-size:12px; font-weight:700; color:var(--muted); }
    .pm-summary{ display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 4px; }
    .pm-area-head{ display:flex; align-items:center; gap:10px; margin:22px 0 10px; font-size:17px; }
    .pm-area-head .dot{ width:12px; height:12px; border-radius:4px; display:inline-block; }
    .pm-task{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px 16px; padding:14px 16px; border-radius:16px;
      border:1px solid var(--line); background:rgba(255,255,255,0.02); margin-bottom:10px; }
    .pm-task.done{ opacity:0.75; }
    .pm-task.abandoned{ opacity:0.55; }
    .pm-task.abandoned .pm-title{ text-decoration:line-through; }
    .pm-title{ font-weight:800; font-size:16px; }
    .pm-meta{ color:var(--muted); font-size:13px; margin-top:4px; display:flex; flex-wrap:wrap; gap:4px 12px; }
    .pm-desc{ font-size:14px; margin-top:6px; white-space:pre-wrap; }
    .pm-by{ color:var(--muted); font-size:12px; margin-top:6px; }
    .pm-actions{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; justify-content:flex-end; }
    .pill{ display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:800; }
    .st-not_started{ background:rgba(148,163,184,0.2); color:#cbd5e1; }
    .st-in_progress{ background:rgba(56,189,248,0.2); color:#7dd3fc; }
    .st-blocked{ background:rgba(249,115,22,0.22); color:#fdba74; }
    .st-done{ background:rgba(34,197,94,0.22); color:#86efac; }
    .st-abandoned{ background:rgba(239,68,68,0.2); color:#fca5a5; }
    .pr-high{ background:rgba(239,68,68,0.2); color:#fca5a5; }
    .pr-low{ background:rgba(148,163,184,0.15); color:#94a3b8; }
    .pill.overdue{ background:#ef4444; color:#fff; }
    .pill.post{ background:rgba(163,230,53,0.18); color:var(--fll-green); }
    .pill.post.all{ background:rgba(251,191,36,0.2); color:#fbbf24; }
    /* Gantt */
    .gantt-tools{ display:flex; flex-wrap:wrap; gap:10px; align-items:end; margin-bottom:12px; }
    .gantt-tools label{ display:grid; gap:4px; font-size:12px; font-weight:700; color:var(--muted); }
    .gantt-wrap{ overflow-x:auto; border:1px solid var(--line); border-radius:14px; }
    .gantt{ display:grid; position:relative; }
    .g-label{ position:sticky; left:0; z-index:2; background:#070b16; padding:6px 10px; border-bottom:1px solid var(--line);
      border-right:1px solid var(--line); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .g-label small{ display:block; color:var(--muted); font-size:11px; }
    .g-row{ position:relative; border-bottom:1px solid var(--line); min-height:44px; }
    .g-group{ position:sticky; left:0; z-index:2; padding:10px; font-weight:800; font-size:13px; background:#0b1220;
      border-bottom:1px solid var(--line); border-right:1px solid var(--line); }
    .g-group-fill{ background:#0b1220; border-bottom:1px solid var(--line); }
    .g-head{ position:sticky; top:0; z-index:3; background:#070b16; border-bottom:1px solid var(--line); height:48px; }
    .g-head-label{ z-index:4; display:flex; align-items:flex-end; font-weight:800; font-size:12px; color:var(--muted); }
    .g-month{ position:absolute; top:4px; font-size:12px; font-weight:800; color:var(--text); white-space:nowrap; padding-left:4px; border-left:1px solid var(--line); height:40px; }
    .g-tick{ position:absolute; bottom:4px; font-size:10px; color:var(--muted); transform:translateX(-50%); }
    .g-grid{ position:absolute; top:0; bottom:0; width:1px; background:rgba(255,255,255,0.05); }
    .g-weekend{ position:absolute; top:0; bottom:0; background:rgba(255,255,255,0.025); }
    .g-today{ position:absolute; top:0; bottom:0; width:2px; background:#f43f5e; z-index:1; }
    .g-bar{ position:absolute; top:9px; height:26px; border-radius:8px; font-size:12px; font-weight:700; color:#020617;
      padding:0 8px; display:flex; align-items:center; white-space:nowrap; overflow:hidden; cursor:default; border:0; font-family:inherit; }
    button.g-bar{ cursor:pointer; }
    .g-bar.not_started{ background:#94a3b8; }
    .g-bar.in_progress{ background:#38bdf8; }
    .g-bar.blocked{ background:#fb923c; }
    .g-bar.key{ box-shadow:0 0 0 2px #fbbf24; }
    .g-bar.not_started{ background:color-mix(in srgb, var(--c, #94a3b8) 55%, #1e293b); color:#f8fafc; }
    .g-break{ position:absolute; top:0; bottom:0; background:repeating-linear-gradient(45deg, rgba(148,163,184,0.10) 0 6px, transparent 6px 12px); }
    .g-event{ position:absolute; top:0; bottom:0; width:3px; background:#a3e635; z-index:1; }
    /* countdown, filters, board */
    .pm-countdown{ display:inline-flex; align-items:baseline; gap:6px; color:var(--muted); font-size:13px; margin-left:auto; margin-right:10px; }
    .pm-countdown strong{ font-size:26px; color:var(--fll-green); line-height:1; }
    .chips{ display:flex; flex-wrap:wrap; gap:6px; }
    .chip{ padding:8px 14px; border-radius:999px; border:1px solid var(--line); background:rgba(255,255,255,0.04); color:var(--muted);
      font:inherit; font-size:14px; font-weight:700; cursor:pointer; }
    .chip.on{ background:var(--c, var(--fll-green)); border-color:var(--c, var(--fll-green)); color:#020617; }
    .pm-filters input[type="search"]{ flex:1 1 160px; padding:9px 12px; border-radius:12px; border:1px solid rgba(255,255,255,0.14);
      background:rgba(2,6,23,0.6); color:var(--text); font:inherit; font-size:14px; }
    .pm-inline{ display:inline-flex !important; gap:6px; align-items:center; font-size:14px; font-weight:700; color:var(--muted); }
    .pm-sum{ margin:6px 0 12px; }
    .kanban-wrap{ overflow-x:auto; padding-bottom:6px; }
    .kanban{ display:grid; grid-auto-flow:column; grid-auto-columns:minmax(250px, 1fr); gap:12px; align-items:start; }
    .kcol{ background:rgba(255,255,255,0.025); border:1px solid var(--line); border-radius:16px; padding:10px; min-height:120px; }
    .kcol-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
    .kc-empty{ text-align:center; font-style:italic; padding:14px 0; }
    .kc-week{ font-size:11px; font-weight:800; letter-spacing:0.6px; text-transform:uppercase; color:var(--fll-green); margin:12px 2px 6px; }
    .kc-week.brk{ color:#94a3b8; }
    .kc-week.list{ margin:18px 0 8px; font-size:12px; }
    .kcard{ display:block; width:100%; text-align:left; background:#0b1220; border:1px solid var(--line); border-left:4px solid var(--c);
      border-radius:12px; padding:10px 12px; margin-bottom:8px; color:var(--text); font:inherit; cursor:pointer; }
    .kcard:hover{ border-color:var(--c); }
    .kcard.done, .kcard.abandoned{ opacity:0.6; }
    .kcard.abandoned .kc-title{ text-decoration:line-through; }
    .kc-top{ display:flex; gap:6px; align-items:center; font-size:12px; }
    .kc-code{ font-weight:800; color:var(--muted); font-size:12px; }
    .kc-key{ color:#fbbf24; font-weight:800; }
    .kc-due{ margin-left:auto; font-weight:800; color:var(--muted); }
    .kc-due.late{ color:#f87171; }
    .kc-title{ font-weight:700; font-size:14px; margin:6px 0; line-height:1.35; }
    .kc-foot{ display:flex; justify-content:space-between; gap:8px; font-size:12px; color:var(--muted); }
    .area-tag{ font-size:11px; font-weight:800; border:1px solid; border-radius:999px; padding:1px 7px; }
    .linklike{ background:none; border:0; padding:0; color:var(--text); font:inherit; font-weight:800; font-size:16px; cursor:pointer; text-align:left; }
    .linklike:hover{ text-decoration:underline; }
    .pm-notes{ list-style:none; padding:0; margin:8px 0; display:grid; gap:8px; }
    .pm-notes li{ background:rgba(255,255,255,0.03); border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-size:14px; white-space:pre-wrap; }
    .pm-notes small{ color:var(--muted); font-size:12px; }
    .g-bar.done{ background:#4ade80; }
    .g-bar.abandoned{ background:repeating-linear-gradient(45deg,#f87171,#f87171 6px,#fca5a5 6px,#fca5a5 12px); opacity:0.7; }
    .g-bar.overdue{ outline:2px solid #ef4444; outline-offset:1px; }
    .g-legend{ display:flex; flex-wrap:wrap; gap:12px; margin-top:10px; font-size:13px; color:var(--muted); }
    .g-legend span{ display:inline-flex; align-items:center; gap:6px; }
    .g-legend i.sw{ width:16px; height:10px; border-radius:3px; display:inline-block; }
    .pm-crumbs{ display:flex; flex-wrap:wrap; gap:14px; margin:-6px 0 18px; font-size:14px; }
    .pm-crumbs a{ color:var(--muted); }
    .pm-modal{ position:fixed; inset:0; background:rgba(2,6,23,0.75); z-index:50; display:flex; align-items:flex-start; justify-content:center;
      padding:90px 16px 16px; overflow:auto; }
    .pm-modal .fll-card{ width:min(760px, 100%); margin:0; }
  </style>
</head>

<body>
  <div class="noise"></div>
  <div class="glow glow-one"></div>
  <div class="glow glow-two"></div>

  <nav class="navbar">
    <a href="index.html" class="brand">Abhijit Shinde</a>
    <div class="nav-links" id="navLinks">
      <a href="index.html">HOME</a>
    </div>
    <button class="menu-btn" onclick="toggleMenu()">☰</button>
  </nav>

  <main class="section pm-page">
    <p class="section-label">Mechanical Masters #67741</p>
    <h1 class="page-title">Project Board</h1>
    <div class="pm-crumbs">
      <a href="fll-team.html"><i class="fa-solid fa-people-group" aria-hidden="true"></i> Team Corner (meetings &amp; calendar)</a>
    </div>
    <div id="pmApp">
      <noscript><p class="fll-card">This page needs JavaScript turned on.</p></noscript>
    </div>
  </main>

  <script src="script.js"></script>
  <script src="fll-projects.js"></script>
</body>
</html>
